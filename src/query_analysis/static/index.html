<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Query Analysis 测试</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a1f;
      --border: #2d2d35;
      --text: #e4e4e7;
      --muted: #71717a;
      --accent: #7c3aed;
      --accent-hover: #8b5cf6;
      --success: #22c55e;
      --warn: #eab308;
      --error: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "SF Mono", "Consolas", "JetBrains Mono", monospace;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      line-height: 1.5;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 1rem;
      color: var(--text);
    }
    .form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .row:last-child { margin-bottom: 0; }
    label {
      color: var(--muted);
      font-size: 0.8rem;
      min-width: 4rem;
    }
    input[type="text"] {
      flex: 1;
      min-width: 200px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-family: inherit;
    }
    input[type="text"]::placeholder { color: var(--muted); }
    select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-family: inherit;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-family: inherit;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .response {
      display: none;
      margin-top: 1rem;
    }
    .response.visible { display: block; }
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .section h2 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .section pre, .section code {
      font-size: 0.8rem;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.conflict { background: var(--error); color: #fff; }
    .badge.ok { background: var(--success); color: #fff; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      text-align: left;
      padding: 0.4rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-weight: 500; }
    .error-msg { color: var(--error); }
    .json-block {
      background: var(--bg);
      padding: 0.75rem;
      border-radius: 6px;
      overflow-x: auto;
      max-height: 200px;
      overflow-y: auto;
    }
    .search-table-wrap {
      overflow-x: auto;
      overflow-y: auto;
      max-height: 280px;
      margin-top: 0.5rem;
    }
    .search-table-wrap table { margin-bottom: 0; }
    .empty { color: var(--muted); font-style: italic; }
    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Query Analysis 测试</h1>
  <div class="form">
    <div class="row">
      <label for="query">Query</label>
      <input type="text" id="query" placeholder="例如：看西游记 不是86版" value="看西游记 不是86版" />
    </div>
    <div class="row">
      <label for="domain">Domain</label>
      <select id="domain">
        <option value="video">video</option>
        <option value="book">book</option>
      </select>
      <label style="min-width:auto;">
        <input type="checkbox" id="execute_es" checked /> 执行 ES 查询
      </label>
      <button type="button" id="submit">解析</button>
    </div>
  </div>
  <div class="response" id="response">
    <div class="error-banner" id="out-error" style="display: none;"></div>
    <div class="section">
      <h2>原始 / 标准化</h2>
      <div id="out-basic"></div>
    </div>
    <div class="section">
      <h2>Conflict</h2>
      <div id="out-conflict"></div>
    </div>
    <div class="section">
      <h2>Constraints</h2>
      <div id="out-constraints"></div>
    </div>
    <div class="section">
      <h2>Dropped constraints</h2>
      <div id="out-dropped"></div>
    </div>
    <div class="section">
      <h2>Entities</h2>
      <div id="out-entities"></div>
    </div>
    <div class="section">
      <h2>Final ES Query</h2>
      <div class="json-block" id="out-es"></div>
    </div>
    <div class="section">
      <h2>Search</h2>
      <div id="out-search"></div>
    </div>
  </div>
  <script>
    const queryEl = document.getElementById('query');
    const domainEl = document.getElementById('domain');
    const executeEsEl = document.getElementById('execute_es');
    const submitEl = document.getElementById('submit');
    const responseEl = document.getElementById('response');

    function byId(id) { return document.getElementById(id); }
    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }
    function renderTable(rows, headers) {
      if (!rows.length) return '<span class="empty">无</span>';
      const h = headers || (rows[0] ? Object.keys(rows[0]) : []);
      let html = '<table><thead><tr>' + h.map(k => '<th>' + escapeHtml(String(k)) + '</th>').join('') + '</tr></thead><tbody>';
      rows.forEach(row => {
        html += '<tr>' + h.map(k => '<td>' + escapeHtml(cellStr(row[k])) + '</td>').join('') + '</tr>';
      });
      return html + '</tbody></table>';
    }
    function cellStr(v) {
      if (v == null) return '';
      if (typeof v === 'object') return JSON.stringify(v);
      return String(v);
    }
    function renderSearchResultsTable(results) {
      if (!results || !results.length) return '';
      const keys = [];
      const seen = new Set();
      results.forEach(row => {
        Object.keys(row || {}).forEach(k => { if (!seen.has(k)) { seen.add(k); keys.push(k); } });
      });
      if (!keys.length) return '<span class="empty">无字段</span>';
      return '<div class="search-table-wrap">' + renderTable(results, keys) + '</div>';
    }
    function renderJson(obj) {
      try {
        return '<pre>' + escapeHtml(JSON.stringify(obj, null, 2)) + '</pre>';
      } catch (_) {
        return '<span class="empty">—</span>';
      }
    }

    submitEl.addEventListener('click', async () => {
      const query = queryEl.value.trim();
      if (!query) return;
      submitEl.disabled = true;
      responseEl.classList.remove('visible');
      try {
        const res = await fetch('/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query,
            domain: domainEl.value,
            execute_es: executeEsEl.checked,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          byId('out-error').style.display = 'none';
          byId('out-basic').innerHTML = '<span class="error-msg">' + escapeHtml(data.detail || res.statusText) + '</span>';
          responseEl.classList.add('visible');
          return;
        }

        if (data.error) {
          byId('out-error').textContent = data.error;
          byId('out-error').style.display = 'block';
        } else {
          byId('out-error').style.display = 'none';
        }

        byId('out-basic').innerHTML =
          '<div><strong>raw_query:</strong> ' + escapeHtml(data.raw_query || '') + '</div>' +
          (data.normalized != null ? '<div><strong>normalized:</strong> ' + escapeHtml(data.normalized) + '</div>' : '');

        byId('out-conflict').innerHTML = data.conflict
          ? '<span class="badge conflict">conflict</span>'
          : '<span class="badge ok">ok</span>';

        byId('out-constraints').innerHTML = renderTable(data.constraints || [], ['field', 'op', 'value', 'source']);
        byId('out-dropped').innerHTML = renderTable(data.dropped_constraints || [], ['field', 'op', 'value']);
        byId('out-entities').innerHTML = (data.entities && data.entities.length)
          ? renderTable(data.entities, ['span', 'field', 'value', 'label'])
          : '<span class="empty">无</span>';
        byId('out-es').innerHTML = renderJson(data.final_es_query || {});

        let searchHtml = '';
        if (data.es_error) {
          searchHtml = '<span class="error-msg">' + escapeHtml(data.es_error) + '</span>';
        } else if (data.search_total != null) {
          searchHtml = '<div>Total: ' + data.search_total + '</div>';
          if (data.search_results && data.search_results.length) {
            searchHtml += renderSearchResultsTable(data.search_results);
          }
        } else {
          searchHtml = '<span class="empty">未执行 ES 或未配置</span>';
        }
        byId('out-search').innerHTML = searchHtml;

        responseEl.classList.add('visible');
      } catch (e) {
        byId('out-basic').innerHTML = '<span class="error-msg">' + escapeHtml(e.message) + '</span>';
        responseEl.classList.add('visible');
      } finally {
        submitEl.disabled = false;
      }
    });
  </script>
</body>
</html>
